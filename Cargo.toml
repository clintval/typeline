[package]
name = "typeline"
version = "3.0.0"
edition = "2024"
rust-version = "1.89"
authors = ["Clint Valentine <valentine.clint@gmail.com>"]
license = "MIT"
description = "The native engine of typeline, which reads and writes dataclasses as delimited text"
repository = "https://github.com/clintval/typeline"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
csv-core = "0.1.13"
itoa = "1.0.18"
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
jiter = { version = "0.17.0", default-features = false }
memchr = "2.8.3"
pyo3 = { version = "0.29", features = ["abi3-py311"], optional = true }
ryu = "1"

[dev-dependencies]
proptest = { version = "1.11", default-features = false, features = ["std"] }
serde_json = "1"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
