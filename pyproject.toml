[project]
name = "typeline"
version = "0.13.0"
description = "Write dataclasses to delimited text formats and read them back again."
authors = [{ name = "Clint Valentine", email = "valentine.clint@gmail.com" }]
license = "MIT"
readme = "README.md"
keywords = ["dataclass", "IO", "delimited-data", "CSV", "TSV", "msgspec"]
include = ["CONTRIBUTING.md", "LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "msgspec>=0.20",
    "typing-extensions>=4.12"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: File Formats",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
"homepage" = "https://github.com/clintval/typeline"
"repository" = "https://github.com/clintval/typeline"
"Bug Tracker" = "https://github.com/clintval/typeline/issues"

[tool.poetry]
requires-poetry = ">=2.0"

[tool.poetry.requires-plugins]
poethepoet = ">=0.48.0"

[tool.poetry.group.dev.dependencies]
basedpyright = "^1.40"
mypy = "^2.3"
pytest = "^9.1"
pytest-cov = "^7.1"
pytest-doctestplus = "^1.7"
ruff = "^0.16"
ty = "^0.0.84"

[build-system]
requires = ["poetry-core>=1.8"]
build-backend = "poetry.core.masonry.api"

[tool.poe]
poetry_command = "task"

[tool.poe.tasks]
fix-format = "ruff format"
fix-lint = "ruff check --fix"

fix-all.ignore_fail = "return_non_zero"
fix-all.sequence = ["fix-format", "fix-lint"]

check-lock = "poetry check --lock"
check-format = "ruff format --check --diff"
check-lint = "ruff check"
check-tests = "pytest --doctest-glob='*.md'"

_check-mypy = "mypy"
_check-pyright = "basedpyright"
_check-ty = "ty check"
check-typing.sequence = ["_check-mypy", "_check-pyright", "_check-ty"]

check-all.ignore_fail = "return_non_zero"
check-all.sequence = [
    "check-lock",
    "check-format",
    "check-lint",
    "check-tests",
    "check-typing"
]

fix-and-check-all.ignore_fail = "return_non_zero"
fix-and-check-all.sequence = [
    "fix-all",
    "check-all"
]

[tool.pytest.ini_options]
minversion = "7.4"
addopts    = [
    "--color=yes",
    "--cov-fail-under=80",
    "--cov-report=term-missing",
    "--cov",
    "--cov=typeline",
    "--doctest-modules",
    "--doctest-plus",
    "--import-mode=importlib",
]
doctest_plus = "enabled"
doctest_optionflags = [
    "ELLIPSIS",
    "IGNORE_EXCEPTION_DETAIL",
    "NORMALIZE_WHITESPACE",
]

[tool.mypy]
files                       = ["typeline/", "tests/"]
strict_optional             = true
strict_equality             = true
check_untyped_defs          = true
disallow_incomplete_defs    = true
disallow_untyped_calls      = true
disallow_untyped_decorators = true
disallow_untyped_defs       = true
no_implicit_optional        = true
warn_no_return              = true
warn_redundant_casts        = true
warn_return_any             = true
warn_unreachable            = true
warn_unused_configs         = true
warn_unused_ignores         = true
enable_error_code           = [
    "ignore-without-code",
    "possibly-undefined",
]

[[tool.mypy.overrides]]
module = ".conftest"
ignore_missing_imports = true

[tool.pyright]
include = ["typeline/", "tests/test_reader_api.py", "tests/test_writer_api.py", "tests/test_real_world_examples.py"]
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"
reportImportCycles = false
failOnWarnings = true
reportAny = false
reportExplicitAny = false
pythonVersion = "3.11"

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.ty.rules]
unused-ignore-comment = "error"

[tool.ruff]
include        = ["typeline/**", "tests/**"]
line-length    = 100
target-version = "py311"
output-format  = "full"
preview        = true

[tool.ruff.lint]
select    = [
    "ARG",    # Unused arguments
    "C901",   # McCabe complexity
    "B",      # bugbear
    "D",      # pydocstyle (docstrings. We have the "google" convention enabled)
    "D204",   # Blank line between class docstring and first (__init__) method
    "D213",   # Summary line should be located on the line after opening quotes
    "E",      # pycodestyle errors
    "LOG",    # flake8-logging
    "LOG015", # (preview rule) Prohibit calls to the root logger
    "F",      # pyflakes
    "I",      # isort
    "N",      # PEP8 naming
    "W",      # pycodestyle warnings
    "Q",      # flake8-quotes
]
ignore    = [
    "E203",
    "E701",
    "D213",  # summary line should be located on the line after opening quote
    "D100",  # missing docstring in public module
    "D104",  # missing docstring in public package
]
unfixable = ["B"]
preview = true

[tool.ruff.lint.mccabe]
max-complexity = 13

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.git-cliff.changelog]
header = ""
trim = true
body = """
{% for group, commits in commits | group_by(attribute="group") %}
    ## {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first }} ({{ commit.id | truncate(length=8, end="") }})\
    {% endfor %}
{% endfor %}\n
"""

[tool.git-cliff.git]
conventional_commits = true
commit_parsers = [
    { message = "^.+!:*", group = "Breaking"},
    { message = "^security*", group = "Security"},
    { message = "^feat*", group = "Features"},
    { message = "^fix*", group = "Bug Fixes"},
    { message = "^docs*", group = "Documentation"},
    { message = "^perf*", group = "Performance"},
    { message = "^refactor*", group = "Refactor"},
    { message = "^style*", group = "Styling"},
    { message = "^test*", group = "Testing"},
    { message = "^chore\\(release\\):*", skip = true},
    { message = "^chore*", group = "Miscellaneous Tasks"},
    { body = ".*security", group = "Security"}
]
filter_commits = false
