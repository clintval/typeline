name: publish typeline

on:
  push:
    tags: '[0-9]+.[0-9]+.[0-9]+'

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: 0.12.20

jobs:
  on-main-branch-check:
    name: on-main-branch-check
    runs-on: ubuntu-latest
    permissions:
      contents: read  # to check out the repository and its history
    outputs:
      on_main: ${{ steps.contains_tag.outputs.retval }}
    steps:
      # TODO: remove this and the `git branch -a` when the following PR
      # is merged and released:
      #   https://github.com/rickstaa/action-contains-tag/pull/18
      - name: git config --global remote.origin.followRemoteHEAD never
        shell: bash
        run: git config --global remote.origin.followRemoteHEAD never

      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the tag is on the main branch
        uses: rickstaa/action-contains-tag@a9ff27d505ba2bf074a2ebb48b208e76d35ff308 # v1.2.10
        id: contains_tag
        with:
          reference: "main"
          tag: "${{ github.ref_name }}"

  unit-tests:
    name: unit-tests
    needs: on-main-branch-check
    if: ${{ needs.on-main-branch-check.outputs.on_main == 'true' }}
    permissions:
      contents: read  # to check out the repository in the called workflow
    uses: ./.github/workflows/tests.yml # zizmor: ignore[self-repository] GitHub does not document $/ for reusable workflows

  build:
    name: build
    needs: unit-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read  # to check out the repository
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: "false"

      - name: Build the source distribution and wheel
        run: uv build --sdist --wheel

      - name: Check the package metadata
        run: uv run --no-project --with twine twine check --strict dist/*

      - name: Upload the distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  verify-install:
    name: verify-install
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        PYTHON_VERSION: ["3.11", "3.12", "3.13", "3.14"]
        DIST: [whl, tar.gz]
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: "false"

      - name: Import every module of the built distribution
        env:
          PYTHON_VERSION: ${{ matrix.PYTHON_VERSION }}
          DIST: ${{ matrix.DIST }}
        run: |
          uv run --no-project --python "$PYTHON_VERSION" --with dist/*."$DIST" python -P - <<'PY'
          import importlib, pkgutil
          import typeline as package
          for module in pkgutil.walk_packages(package.__path__, package.__name__ + "."):
              importlib.import_module(module.name)
          print("imported every module of", package.__name__)
          PY

  publish-to-pypi:
    name: publish-to-pypi
    runs-on: ubuntu-latest
    needs: [build, verify-install]
    environment: pypi
    permissions:
      id-token: write  # to publish to PyPI as a trusted publisher
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
          print-hash: true
          verbose: true

  make-changelog:
    name: make-changelog
    runs-on: ubuntu-latest
    needs: publish-to-pypi
    permissions:
      contents: read  # to check out the tagged commit and its history
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout the Repository at the Tagged Commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Generate a Changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        id: git-cliff
        with:
          config: pyproject.toml
          args: --latest --verbose
        env:
          GITHUB_REPO: ${{ github.repository }}

  make-github-release:
    name: make-github-release
    runs-on: ubuntu-latest
    environment: github
    permissions:
      contents: write  # to create the GitHub release
    needs: [build, make-changelog]
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Create the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ needs.make-changelog.outputs.release_body }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "$NOTES"
